name: build

on:
  push:
    # The runtime diagnostics branch must never publish an ordinary binary
    # install artifact.  Keep the branch exclusion separate from the explicit
    # tag inclusion: defining only a branch filter would disable every tag.
    branches-ignore:
      - crutkas-finish-runtime-diagnostics
    tags:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: x86_64 MSYS runtime build
    # Suppress only the same-repository diagnostic PR.  A fork may legitimately
    # use the same branch leaf, and non-PR events have no pull_request payload.
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name != github.repository ||
        github.event.pull_request.head.ref != 'crutkas-finish-runtime-diagnostics'
      }}
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: setup-msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: MSYS
          update: true
          install: msys2-devel base-devel autotools cocom diffutils gcc gettext-devel libiconv-devel make mingw-w64-cross-crt mingw-w64-cross-gcc mingw-w64-cross-zlib perl zlib-devel xmlto docbook-xsl libzstd-devel

      - name: Build
        shell: msys2 {0}
        run: |
          (cd winsup && ./autogen.sh)
          ./configure --disable-dependency-tracking --with-msys2-runtime-commit="$GITHUB_SHA"
          make -j8

      - name: Install
        shell: msys2 {0}
        run: |
          make DESTDIR="$(pwd)"/_dest install

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: install
          path: _dest/

  generate-msys2-tests-matrix:
    name: compatibility test matrix
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name != github.repository ||
        github.event.pull_request.head.ref != 'crutkas-finish-runtime-diagnostics'
      }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        uses: msys2/msys2-tests/gha-matrix-gen@main

  msys2-tests:
    needs: [build, generate-msys2-tests-matrix]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-msys2-tests-matrix.outputs.matrix) }}

    # These lanes consume the x86_64 MSYS runtime artifact produced above.
    # CLANGARM64 here verifies compatibility, not native ARM64 runtime code.
    name: compatibility tests ${{ matrix.msystem }}-${{ matrix.cc }} (x86_64 runtime)
    runs-on: ${{ matrix.runner }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      FC: ${{ matrix.fc }}
    steps:
      - id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.packages }}

      - name: Add staging repo
        shell: msys2 {0}
        run: |
          sed -i '1s|^|[staging]\nServer = https://repo.msys2.org/staging/\nSigLevel = Never\n|' /etc/pacman.conf

      - name: Update using staging
        shell: pwsh
        run: |
          msys2 -c 'pacman --noconfirm -Suuy'
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          msys2 -c 'pacman --noconfirm -Suu'

      - name: Download msys2-runtime artifact
        uses: actions/download-artifact@v8
        with:
          name: install
          path: ${{ steps.msys2.outputs.msys2-location }}

      - name: uname -a
        shell: msys2 {0}
        run: uname -a

      - name: Run tests
        uses: msys2/msys2-tests@main

  aarch64-foundations:
    name: native ARM64 foundation validation
    runs-on: windows-11-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify native ARM64 runner
        shell: pwsh
        run: |
          & .github/checks/assert-runner-architecture.ps1 `
            -ExpectedNativeMachine ARM64 `
            -ExpectedProcessArchitecture Arm64 `
            -EvidencePath "$env:RUNNER_TEMP\arm64-runner.txt"

      - name: Set up native CLANGARM64 tools
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-llvm

      - name: Compile and execute ARM64 foundations
        shell: msys2 {0}
        run: .github/checks/test-aarch64-foundations.sh

  aarch64-link-runtime:
    name: native ARM64 linker/runtime focused validation
    runs-on: windows-11-arm

    steps:
      - name: Checkout runtime source
        uses: actions/checkout@v7

      - name: Checkout pinned BusyBox source
        uses: actions/checkout@v7
        with:
          repository: crutkas/busybox-w32
          ref: c26a88d7e1ec96a1b96fce442e35378f3ddecba4
          fetch-depth: 0
          path: .layer3-input-source/busybox-w32

      - name: Checkout reviewed Binutils source
        uses: actions/checkout@v7
        with:
          repository: crutkas/binutils-woarm64
          ref: eb40c26f66fc723d7e87c294c2a4ca840d5d7f7d
          fetch-depth: 0
          fetch-tags: true
          path: .layer3-input-source/binutils-woarm64

      - name: Verify native ARM64 runner
        shell: pwsh
        run: |
          & .github/checks/assert-runner-architecture.ps1 `
            -ExpectedNativeMachine ARM64 `
            -ExpectedProcessArchitecture Arm64 `
            -EvidencePath "$env:RUNNER_TEMP\arm64-layer3-runner.txt"

      - id: msys2
        name: Set up native CLANGARM64 tools
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-llvm
            mingw-w64-clang-aarch64-perl

      - name: Verify pinned native inputs
        shell: pwsh
        run: |
          & .github/checks/prepare-aarch64-layer3-inputs.ps1 `
            -Destination "$env:RUNNER_TEMP\layer3-inputs" `
            -BusyBoxSource "$env:GITHUB_WORKSPACE\.layer3-input-source\busybox-w32" `
            -BinutilsSource "$env:GITHUB_WORKSPACE\.layer3-input-source\binutils-woarm64"

          $clangArm64 = '${{ steps.msys2.outputs.msys2-location }}\clangarm64'
          "CC=$clangArm64\bin\clang.exe" | Add-Content $env:GITHUB_ENV
          "NATIVE_PERL=$clangArm64\bin\perl.exe" | Add-Content $env:GITHUB_ENV
          "LLVM_AR=$clangArm64\bin\llvm-ar.exe" | Add-Content $env:GITHUB_ENV
          "LLVM_NM=$clangArm64\bin\llvm-nm.exe" | Add-Content $env:GITHUB_ENV
          "LLVM_OBJCOPY=$clangArm64\bin\llvm-objcopy.exe" |
            Add-Content $env:GITHUB_ENV
          "CLANGARM64_LIB=$clangArm64\lib" | Add-Content $env:GITHUB_ENV

      - name: Compile, link, and execute focused ARM64 controls
        shell: pwsh
        run: |
          $env:PATH = "$env:BUSYBOX_BIN;$env:PATH"
          & $env:BUSYBOX_SH '.github/checks/test-aarch64-link-runtime.sh'
          if ($LASTEXITCODE -ne 0) {
            throw "Focused native ARM64 controls failed with exit code $LASTEXITCODE"
          }

  aarch64-layer4-runtime:
    name: native ARM64 signal, SEH, pthread/TLS, and fastcwd validation
    runs-on: windows-11-arm

    steps:
      - name: Checkout runtime source
        uses: actions/checkout@v7

      - name: Checkout pinned BusyBox source
        uses: actions/checkout@v7
        with:
          repository: crutkas/busybox-w32
          ref: c26a88d7e1ec96a1b96fce442e35378f3ddecba4
          fetch-depth: 0
          path: .layer4-input-source/busybox-w32

      - name: Checkout reviewed Binutils source
        uses: actions/checkout@v7
        with:
          repository: crutkas/binutils-woarm64
          ref: eb40c26f66fc723d7e87c294c2a4ca840d5d7f7d
          fetch-depth: 0
          fetch-tags: true
          path: .layer4-input-source/binutils-woarm64

      - name: Verify native ARM64 runner
        shell: pwsh
        run: |
          & .github/checks/assert-runner-architecture.ps1 `
            -ExpectedNativeMachine ARM64 `
            -ExpectedProcessArchitecture Arm64 `
            -EvidencePath "$env:RUNNER_TEMP\arm64-layer4-runner.txt"

      - id: msys2
        name: Set up native Clang ARM64 tools
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            msys2-devel
            autotools
            make
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-llvm
            mingw-w64-clang-aarch64-perl

      - name: Verify pinned native inputs
        shell: pwsh
        run: |
          & .github/checks/prepare-aarch64-layer3-inputs.ps1 `
            -Destination "$env:RUNNER_TEMP\layer4-inputs" `
            -BusyBoxSource "$env:GITHUB_WORKSPACE\.layer4-input-source\busybox-w32" `
            -BinutilsSource "$env:GITHUB_WORKSPACE\.layer4-input-source\binutils-woarm64"

          $clangArm64 = '${{ steps.msys2.outputs.msys2-location }}\clangarm64'
          "CC=$clangArm64\bin\clang.exe" | Add-Content $env:GITHUB_ENV
          "NATIVE_PERL=$clangArm64\bin\perl.exe" | Add-Content $env:GITHUB_ENV
          "LLVM_READOBJ=$clangArm64\bin\llvm-readobj.exe" |
            Add-Content $env:GITHUB_ENV
          "CLANGARM64_LIB=$clangArm64\lib" | Add-Content $env:GITHUB_ENV

      - name: Configure and compile production path object
        shell: msys2 {0}
        run: .github/checks/test-aarch64-layer4-path-build.sh

      - name: Compile and execute production layer-4 paths
        shell: pwsh
        run: |
          $env:PATH = "$env:BUSYBOX_BIN;$env:PATH"
          & $env:BUSYBOX_SH '.github/checks/test-aarch64-layer4-runtime.sh'
          if ($LASTEXITCODE -ne 0) {
            throw "Native ARM64 layer-4 controls failed with exit code $LASTEXITCODE"
          }

  x64-on-arm64-fastcwd:
    name: x86_64-on-ARM64 fastcwd validation (emulated x86_64)
    runs-on: windows-11-arm

    steps:
      - name: Checkout runtime source
        uses: actions/checkout@v7

      - name: Verify native ARM64 host
        shell: pwsh
        run: |
          & .github/checks/assert-runner-architecture.ps1 `
            -ExpectedNativeMachine ARM64 `
            -ExpectedProcessArchitecture Arm64 `
            -EvidencePath "$env:RUNNER_TEMP\x64-on-arm64-host.txt"

      - id: msys2
        name: Set up native Clang ARM64 tools
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-llvm

      - name: Compile and execute x86_64 production fastcwd path
        shell: pwsh
        run: .github/checks/test-x64-on-arm64-fastcwd.ps1
        env:
          LAYER4_LLVM_BIN: >-
            ${{ steps.msys2.outputs.msys2-location }}\clangarm64\bin

  aarch64-layer5-math:
    name: native ARM64 math and diagnostic utilities validation
    runs-on: windows-11-arm

    steps:
      - name: Checkout runtime source
        uses: actions/checkout@v7

      - name: Checkout reviewed BFD headers
        uses: actions/checkout@v7
        with:
          repository: crutkas/binutils-woarm64
          ref: eb40c26f66fc723d7e87c294c2a4ca840d5d7f7d
          fetch-depth: 1
          path: .layer5-bfd-headers

      - name: Verify native ARM64 runner
        shell: pwsh
        run: |
          & .github/checks/assert-runner-architecture.ps1 `
            -ExpectedNativeMachine ARM64 `
            -ExpectedProcessArchitecture Arm64 `
            -EvidencePath "$env:RUNNER_TEMP\arm64-layer5-runner.txt"

      - id: msys2
        name: Set up native Clang ARM64 tools
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-llvm

      - name: Verify layer-5 source invariants
        shell: msys2 {0}
        run: .github/checks/test-layer5-static.sh

      - name: Compile utilities and execute production math and SSP paths
        shell: msys2 {0}
        run: .github/checks/test-aarch64-layer5.sh
        env:
          CC: /clangarm64/bin/clang.exe
          CXX: /clangarm64/bin/clang++.exe
          BFD_SOURCE_ROOT: ${{ github.workspace }}/.layer5-bfd-headers
          LLVM_NM: /clangarm64/bin/llvm-nm.exe
          LLVM_OBJDUMP: /clangarm64/bin/llvm-objdump.exe
          LLVM_READOBJ: /clangarm64/bin/llvm-readobj.exe

  aarch64-git-bash-mvp:
    name: native ARM64 Git Bash MVP runtime
    runs-on: windows-11-arm
    timeout-minutes: 120

    steps:
      - name: Checkout runtime source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify native ARM64 runner
        shell: pwsh
        run: |
          & .github/checks/assert-runner-architecture.ps1 `
            -ExpectedNativeMachine ARM64 `
            -ExpectedProcessArchitecture Arm64 `
            -EvidencePath "$env:RUNNER_TEMP\arm64-mvp-runner.txt"

      - id: msys2
        name: Set up approved native ARM64 build tools
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            mingw-w64-clang-aarch64-clang=22.1.8-2
            mingw-w64-clang-aarch64-compiler-rt=22.1.8-2
            mingw-w64-clang-aarch64-crt=14.0.0.r302.gd7f3c5201-1
            mingw-w64-clang-aarch64-headers=14.0.0.r302.gd7f3c5201-1
            mingw-w64-clang-aarch64-lld=22.1.8-2
            mingw-w64-clang-aarch64-libwinpthread=14.0.0.r302.gd7f3c5201-1
            mingw-w64-clang-aarch64-llvm=22.1.8-2
            mingw-w64-clang-aarch64-llvm-tools=22.1.8-2
            mingw-w64-clang-aarch64-make=4.4.1-5
            mingw-w64-clang-aarch64-ncurses=6.6-4
            mingw-w64-clang-aarch64-perl=5.44.0-3
            mingw-w64-clang-aarch64-winpthreads=14.0.0.r302.gd7f3c5201-1

      - name: Download exact public MVP inputs
        shell: pwsh
        run: |
          $workRoot = if (Test-Path -LiteralPath 'D:\') {
            'D:\git-bash-mvp'
          } else {
            "$env:RUNNER_TEMP\git-bash-mvp"
          }
          "MVP_WORK_ROOT=$workRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          $inputs = "$workRoot-inputs"
          "MVP_INPUT_ROOT=$inputs" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Path $inputs -Force | Out-Null
          Invoke-WebRequest `
            -Uri 'https://github.com/crutkas/binutils-woarm64/releases/download/native-binutils-eb40c26f66fc/busybox-c26a88d7.tar.gz' `
            -OutFile "$inputs\busybox-c26a88d7.tar.gz"
          Invoke-WebRequest `
            -Uri 'https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.3/MinGit-2.55.0.3-arm64.zip' `
            -OutFile "$inputs\MinGit-2.55.0.3-arm64.zip"
          Invoke-WebRequest `
            -Uri 'https://github.com/crutkas/msys2-runtime/releases/download/native-generators-layer6-20260829/native-generators-arm64.zip' `
            -OutFile "$inputs\native-generators-arm64.zip"

      - name: Build native runtime and Bash from exact source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:MVP_WORK_ROOT" -Force | Out-Null
          Set-Content -LiteralPath "$env:MVP_WORK_ROOT\stale-sentinel" `
            -Value 'must be removed before configuration'
          & .github/checks/build-aarch64-mvp-runtime.ps1 `
            -Source "$env:GITHUB_WORKSPACE" `
            -Work "$env:MVP_WORK_ROOT" `
            -ClangPrefix '${{ steps.msys2.outputs.msys2-location }}\clangarm64\bin' `
            -BusyBoxArchive "$env:MVP_INPUT_ROOT\busybox-c26a88d7.tar.gz" `
            -GeneratorArchive "$env:MVP_INPUT_ROOT\native-generators-arm64.zip" `
            -MinGitArchive "$env:MVP_INPUT_ROOT\MinGit-2.55.0.3-arm64.zip" `
            -Jobs 20

      - name: Assemble deterministic MVP artifact
        shell: pwsh
        run: |
          $work = "$env:MVP_WORK_ROOT"
          $runtimeCommit = (& git rev-parse 'HEAD^{commit}').Trim()
          & .github/checks/package-aarch64-mvp-runtime.ps1 `
            -RuntimeDll "$work\build\aarch64-pc-cygwin\winsup\cygwin\new-msys-2.0.dll" `
            -BashExe "$work\bash-build\bash.exe" `
            -BusyBoxExe "$work\inputs\busybox-c26a88d7\bin\busybox.exe" `
            -MinGitRoot "$work\mingit" `
            -ClangPrefix '${{ steps.msys2.outputs.msys2-location }}\clangarm64\bin' `
            -NativePerl '${{ steps.msys2.outputs.msys2-location }}\clangarm64\bin\perl.exe' `
            -NativeSsh "$env:SystemRoot\System32\OpenSSH\ssh.exe" `
            -Destination "$env:RUNNER_TEMP\git-bash-mvp-publish" `
            -RuntimeCommit $runtimeCommit

      - name: Exercise runtime, Bash, Git, and emulated x64 child
        shell: pwsh
        run: |
          $work = "$env:MVP_WORK_ROOT"
          $movedRoot = "$env:RUNNER_TEMP\git-bash-mvp-moved"
          if (Test-Path -LiteralPath $movedRoot) {
            Remove-Item -LiteralPath $movedRoot -Recurse -Force
          }
          Expand-Archive `
            -LiteralPath "$env:RUNNER_TEMP\git-bash-mvp-publish\native-git-bash-mvp-arm64.zip" `
            -DestinationPath $movedRoot
          & .github/checks/test-aarch64-mvp-runtime.ps1 `
            -RuntimeRoot $movedRoot `
            -RuntimeSource "$env:GITHUB_WORKSPACE" `
            -RuntimeBuild "$work\build" `
            -ClangPrefix '${{ steps.msys2.outputs.msys2-location }}\clangarm64\bin' `
            -CrtPrefix '${{ steps.msys2.outputs.msys2-location }}\clangarm64' `
            -BusyBox "$work\inputs\busybox-c26a88d7\bin\busybox.exe" `
            -MinGitRoot "$work\mingit" `
            -EvidencePath "$env:RUNNER_TEMP\git-bash-mvp-publish\validation.json"

      - name: Upload deterministic Git Bash MVP runtime
        uses: actions/upload-artifact@v6
        with:
          name: native-git-bash-mvp-arm64
          path: |
            ${{ runner.temp }}\git-bash-mvp-publish\native-git-bash-mvp-arm64.zip
            ${{ runner.temp }}\git-bash-mvp-publish\artifact.json
            ${{ runner.temp }}\git-bash-mvp-publish\validation.json
          if-no-files-found: error
          compression-level: 0

  x86_64-expm1l:
    name: x86_64 production expm1l regression
    runs-on: windows-latest

    steps:
      - name: Checkout runtime source
        uses: actions/checkout@v7

      - name: Set up x86_64 MSYS tools
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: MSYS
          update: true
          install: gcc

      - name: Verify layer-5 source invariants
        shell: msys2 {0}
        run: .github/checks/test-layer5-static.sh

      - name: Compile and execute production expm1l
        shell: msys2 {0}
        run: .github/checks/test-x86_64-expm1l.sh
