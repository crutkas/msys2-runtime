name: build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  aarch64-compiler-checks:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: setup-msys2
        uses: msys2/setup-msys2@v2
        with:
          location: ${{ runner.temp }}\aarch64-msys-toolchain
          msystem: MSYS
          update: true
          # autotools provides /usr/bin/aclocal, /usr/bin/autoconf, and
          # /usr/bin/automake, which winsup/autogen.sh (invoked below by
          # the cygtls-lock, autoload, and POSIX-thread-startup checks)
          # calls directly. It is already part of the (passing) x86_64
          # build job's package list; this job was simply missing it,
          # causing a pre-existing, deterministic "aclocal: No such file
          # or directory" failure here (reproduced on the unmodified base
          # branch as well, unrelated to the AArch64 wsock autoload fix)
          # that aborted the job before the _wsock_init disassembly
          # assertions below could ever run.
          install: autotools base-devel cocom gcc git gmp isl libiconv libintl libzstd mpc mpfr zlib

      - name: Install fork-local AArch64 runtime toolchain
        run: ./.github/checks/install-aarch64-runtime-toolchain.sh

      - name: Verify pthread initializer architecture split
        run: ./.github/checks/validate-pthread-initializer-macros.sh

      - name: Verify AArch64 endian primitives
        run: |
          compiler="$TOOLCHAIN_DIR/bin/aarch64-pc-cygwin-gcc"
          objdump="$TOOLCHAIN_DIR/bin/aarch64-pc-cygwin-objdump"
          "$compiler" \
            -std=gnu11 \
            -O2 \
            -Wall \
            -Wextra \
            -Werror \
            -isystem "$GITHUB_WORKSPACE/winsup/cygwin/include" \
            -isystem "$GITHUB_WORKSPACE/newlib/targ-include" \
            -isystem "$GITHUB_WORKSPACE/newlib/libc/include" \
            -isystem "$TOOLCHAIN_DIR/include" \
            -c \
            "$GITHUB_WORKSPACE/.github/checks/endian-primitives.c" \
            -o aarch64-endian-primitives.o

          "$objdump" -dr aarch64-endian-primitives.o \
            | tee aarch64-endian-primitives.dis
          for symbol in checked_ntohs checked_htons; do
            "$objdump" -dr --disassemble="$symbol" \
              aarch64-endian-primitives.o \
              > "aarch64-$symbol.dis"
            grep -Eq '[[:space:]]uxth[[:space:]]+w0, w0' \
              "aarch64-$symbol.dis"
            grep -Eq '[[:space:]]rev16[[:space:]]+w0, w0' \
              "aarch64-$symbol.dis"
          done
          for symbol in checked_ntohl checked_htonl; do
            "$objdump" -dr --disassemble="$symbol" \
              aarch64-endian-primitives.o \
              > "aarch64-$symbol.dis"
            grep -Eq '[[:space:]]rev[[:space:]]+w0, w0' \
              "aarch64-$symbol.dis"
          done
          "$objdump" -dr --disassemble=checked_bswap_16 \
            aarch64-endian-primitives.o \
            | grep -Eq '[[:space:]]rev16[[:space:]]+w0, w0'
          "$objdump" -dr --disassemble=checked_bswap_32 \
            aarch64-endian-primitives.o \
            | grep -Eq '[[:space:]]rev[[:space:]]+w0, w0'
          "$objdump" -dr --disassemble=checked_bswap_64 \
            aarch64-endian-primitives.o \
            | grep -Eq '[[:space:]]rev[[:space:]]+x0, x0'
          "$objdump" -dr --disassemble=checked_constant_ntohs \
            aarch64-endian-primitives.o \
            > aarch64-constant-ntohs.dis
          "$objdump" -dr --disassemble=checked_constant_ntohl \
            aarch64-endian-primitives.o \
            > aarch64-constant-ntohl.dis

          if grep -Eq '[[:space:]](bswap|xchg)' \
              aarch64-endian-primitives.dis; then
            exit 1
          fi
          if grep -Eq '[[:space:]]rev(16)?[[:space:]]' \
              aarch64-constant-ntohs.dis \
              aarch64-constant-ntohl.dis; then
            exit 1
          fi

          # The behavioral runtime check (aarch64-endian-runtime.c) is
          # cross-compiled and linked against the real AArch64 Cygwin
          # runtime in the aarch64-linker-script job below, then executed
          # natively on windows-11-arm in aarch64-runtime-smoke. It must
          # not be compiled/run with the host's own (x86_64) gcc here,
          # since that both defeats the purpose of the check (the file
          # gates on __aarch64__) and cannot execute an ARM64 binary.

      - name: Compile and disassemble AArch64 cygtls lock
        run: |
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export CC=aarch64-pc-cygwin-gcc
          export CXX=aarch64-pc-cygwin-g++
          (cd winsup && ./autogen.sh)
          mkdir build-cygtls-lock
          (
            cd build-cygtls-lock
            ac_cv_lib_sframe_sframe_decode=no \
            ac_cv_lib_zstd_ZSTD_isError=no \
              ../winsup/configure \
                --host=aarch64-pc-cygwin \
                --target=aarch64-pc-cygwin \
                --with-cross-bootstrap \
                --disable-doc
          )
          make -C build-cygtls-lock/cygwin globals.h

          compiler="$TOOLCHAIN_DIR/bin/aarch64-pc-cygwin-g++"
          objdump="$TOOLCHAIN_DIR/bin/aarch64-pc-cygwin-objdump"
          "$compiler" \
            -DHAVE_CONFIG_H \
            -I"$GITHUB_WORKSPACE/build-cygtls-lock/cygwin" \
            -I"$GITHUB_WORKSPACE/winsup/cygwin/local_includes" \
            -I"$GITHUB_WORKSPACE/winsup/cygwin" \
            -isystem "$GITHUB_WORKSPACE/winsup/cygwin/include" \
            -isystem "$TOOLCHAIN_DIR/include" \
            -isystem "$GITHUB_WORKSPACE/newlib/targ-include" \
            -isystem "$GITHUB_WORKSPACE/newlib/libc/include" \
            -fno-rtti \
            -fno-exceptions \
            -fno-use-cxa-atexit \
            -Wall \
            -Werror \
            -O2 \
            -c \
            "$GITHUB_WORKSPACE/.github/checks/cygtls-lock.cc" \
            -o aarch64-cygtls-lock.o
          "$objdump" -d aarch64-cygtls-lock.o | tee aarch64-cygtls-lock.dis
          grep -Eq '[[:space:]]dmb[[:space:]]+ishst([[:space:]]|$)' \
            aarch64-cygtls-lock.dis
          grep -Eq '[[:space:]]yield([[:space:]]|$)' \
            aarch64-cygtls-lock.dis
          if grep -Eq '[[:space:]]pause([[:space:]]|$)' \
              aarch64-cygtls-lock.dis; then
            exit 1
          fi

      - name: Compile and inspect AArch64 autoload thunks
        run: |
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export CC=aarch64-pc-cygwin-gcc
          export CXX=aarch64-pc-cygwin-g++
          make -C build-cygtls-lock/cygwin autoload.o

          object=build-cygtls-lock/cygwin/autoload.o
          objdump="$TOOLCHAIN_DIR/bin/aarch64-pc-cygwin-objdump"
          objcopy="$TOOLCHAIN_DIR/bin/aarch64-pc-cygwin-objcopy"
          nm="$TOOLCHAIN_DIR/bin/aarch64-pc-cygwin-nm"
          test -f "$object"

          "$objdump" -h "$object" | tee aarch64-autoload.sections
          "$objdump" -dr "$object" | tee aarch64-autoload.dis
          "$objdump" -r "$object" | tee aarch64-autoload.relocs
          "$nm" -a "$object" | tee aarch64-autoload.symbols

          for section in \
              .data_cygwin_nocopy \
              .advapi32_autoload_text \
              .winmm_autoload_text \
              .pdata \
              .xdata; do
            grep -Fq "$section" aarch64-autoload.sections
          done
          for symbol in \
              CheckTokenMembership \
              _std_dll_init \
              _wsock_init \
              dll_func_load \
              dll_chain; do
            grep -Eq "[[:space:]][Tt] ${symbol}$" aarch64-autoload.symbols
          done

          # LoadDLLfuncEx3 preserves x0-x8 and LR in an aligned 80-byte frame,
          # calls through dll_info.load_state, and re-enters the patched thunk.
          grep -Eq '[[:space:]]sub[[:space:]]+sp, sp, #0x50' \
            aarch64-autoload.dis
          for pair in \
              'x0, x1, \[sp\]' \
              'x2, x3, \[sp, #16\]' \
              'x4, x5, \[sp, #32\]' \
              'x6, x7, \[sp, #48\]' \
              'x8, x30, \[sp, #64\]'; do
            grep -Eq "[[:space:]]stp[[:space:]]+${pair}" \
              aarch64-autoload.dis
            grep -Eq "[[:space:]]ldp[[:space:]]+${pair}" \
              aarch64-autoload.dis
          done
          grep -Eq '[[:space:]]blr[[:space:]]+x17' aarch64-autoload.dis
          grep -Eq '[[:space:]]stur[[:space:]]+x0, \[x2, #12\]' \
            aarch64-autoload.dis
          grep -Eq '[[:space:]]sub[[:space:]]+x16, x2, #0x34' \
            aarch64-autoload.dis
          grep -Eq '[[:space:]]br[[:space:]]+x16' aarch64-autoload.dis

          # dll_chain adds one aligned frame.  The resolver's non-fatal path
          # reports ERROR_PROC_NOT_FOUND; its fatal path calls api_fatal.
          grep -Eq \
            '[[:space:]]stp[[:space:]]+x0, xzr, \[sp, #-16\]!' \
            aarch64-autoload.dis
          grep -Eq '[[:space:]]br[[:space:]]+x1' aarch64-autoload.dis
          grep -Fq 'SetLastError' aarch64-autoload.relocs
          grep -Fq 'api_fatal' aarch64-autoload.relocs
          grep -Fq 'GetProcAddress' aarch64-autoload.relocs

          # Both the std_dll_init INIT_WRAPPER and the _wsock_init hand-off
          # wrapper carry ARM64 Windows unwind records.
          test "$(grep -Ec '[[:space:]][Tt] _std_dll_init$|[[:space:]][Tt] _wsock_init$' \
            aarch64-autoload.symbols)" -eq 2
          test "$(grep -Ec '[.]pdata|[.]xdata' aarch64-autoload.sections)" -ge 2

          # _wsock_init is entered from dll_chain via "br x1", not a call,
          # so (unlike _std_dll_init, reached via "blr") x30 does not hold
          # a usable return address there.  It must recover func_info*
          # from the [sp, #16] slot dll_chain pushed instead, and must
          # tail-branch straight into dll_func_load afterwards, reusing
          # that one func_info frame rather than leaking a second one
          # through another dll_chain round trip.
          #
          # Bound the extracted disassembly strictly to _wsock_init's own
          # body: start at its "<_wsock_init>:" label and stop at the next
          # "<symbol>:" label, whatever it happens to be, rather than
          # hardcoding the following function's name (which is fragile if
          # symbol order ever changes) or reading to end-of-file (which
          # would let assertions like "br x16" or "no mov x0, x30" match
          # unrelated code in later functions, e.g. dll_func_load itself).
          awk '
            /^[0-9a-f]+ <_wsock_init>:$/ { found = 1; print; next }
            found && /^[0-9a-f]+ <[^>]+>:$/ { exit }
            found { print }
          ' aarch64-autoload.dis | tee aarch64-wsock-init.dis
          test -s aarch64-wsock-init.dis
          if tail -n +2 aarch64-wsock-init.dis \
              | grep -Eq '^[0-9a-f]+ <[^>]+>:$'; then
            echo "_wsock_init disassembly slice leaked into another symbol" >&2
            exit 1
          fi
          grep -Eq '[[:space:]]ldr[[:space:]]+x0, \[sp, #16\]' \
            aarch64-wsock-init.dis
          grep -Eq '[[:space:]]br[[:space:]]+x16' aarch64-wsock-init.dis
          if grep -Eq '[[:space:]]mov[[:space:]]+x0, x30' \
              aarch64-wsock-init.dis; then
            echo "_wsock_init must not derive func_info* from x30 on AArch64" >&2
            exit 1
          fi
          if grep -Fq '<dll_chain>' aarch64-wsock-init.dis; then
            echo "_wsock_init must not route back through dll_chain" >&2
            exit 1
          fi
          # wsock_init() (the C worker _wsock_init's "bl wsock_init" calls)
          # is a local, same-section branch that the assembler/linker
          # resolves directly -- objdump shows e.g. "bl 288 <wsock_init>"
          # with no relocation entry, so it can never appear in the
          # relocs list.  Only dll_func_load is reached via an adrp/add
          # pair that does require one.  Assert the call target from the
          # bounded _wsock_init disassembly instead of the relocs list.
          grep -Eq '[[:space:]]bl[[:space:]]+[0-9a-f]+ <wsock_init>$' \
            aarch64-wsock-init.dis
          grep -Fq 'dll_func_load' aarch64-autoload.relocs

          mkdir aarch64-autoload-sections
          "$objcopy" \
            --dump-section \
            .data_cygwin_nocopy=aarch64-autoload-sections/dll-info.bin \
            "$object"
          "$objcopy" \
            --dump-section \
            .advapi32_autoload_text=aarch64-autoload-sections/advapi32.bin \
            "$object"
          od -An -tx1 -v aarch64-autoload-sections/dll-info.bin \
            | tr -d ' \n' \
            | grep -Fq \
                '610064007600610070006900330032002e0064006c006c000000'
          od -An -tx1 -v aarch64-autoload-sections/advapi32.bin \
            | tr -d ' \n' \
            | grep -Fq \
                '436865636b546f6b656e4d656d6265727368697000'

      - name: Compile and inspect AArch64 POSIX thread startup
        run: |
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export CC=aarch64-pc-cygwin-gcc
          export CXX=aarch64-pc-cygwin-g++
          make -C build-cygtls-lock/cygwin create_posix_thread.o

          object=build-cygtls-lock/cygwin/create_posix_thread.o
          objdump="$TOOLCHAIN_DIR/bin/aarch64-pc-cygwin-objdump"
          nm="$TOOLCHAIN_DIR/bin/aarch64-pc-cygwin-nm"
          test -f "$object"

          "$objdump" -h "$object" | tee aarch64-posix-thread.sections
          "$objdump" -dr "$object" | tee aarch64-posix-thread.dis
          "$objdump" -r "$object" | tee aarch64-posix-thread.relocs
          "$nm" -a "$object" | tee aarch64-posix-thread.symbols

          for symbol in \
              create_new_main_thread_stack \
              create_posix_thread \
              pthread_wrapper; do
            grep -Eq "[[:space:]][Tt] ${symbol}$" \
              aarch64-posix-thread.symbols
          done
          for section in .pdata .xdata; do
            grep -Fq "$section" aarch64-posix-thread.sections
          done

          sed -n '/<pthread_wrapper>:/,/<create_new_main_thread_stack>:/p' \
            aarch64-posix-thread.dis \
            | sed '$d' \
            > aarch64-pthread-wrapper.dis
          test -s aarch64-pthread-wrapper.dis

          # The accepted fixed sequence saves func/arg before releasing the
          # temporary OS stack, switches to the 16-byte-aligned Cygwin stack,
          # then enters the pthread trampoline with its argument in x0.
          grep -Eq \
            '[[:space:]]ldp[[:space:]]+x20, x21, \[x[0-9]+\]' \
            aarch64-pthread-wrapper.dis
          grep -Eq \
            '[[:space:]]ldp[[:space:]]+x0, x1, \[x[0-9]+, #16\]' \
            aarch64-pthread-wrapper.dis
          grep -Eq \
            '[[:space:]]sub[[:space:]]+sp, x1, x[0-9]+' \
            aarch64-pthread-wrapper.dis
          grep -Eq \
            '[[:space:]]mov[[:space:]]+x29, xzr' \
            aarch64-pthread-wrapper.dis
          grep -Eq \
            '[[:space:]]mov[[:space:]]+x2, #0x8000' \
            aarch64-pthread-wrapper.dis
          grep -Eq \
            '[[:space:]]mov[[:space:]]+x0, x21' \
            aarch64-pthread-wrapper.dis
          grep -Eq \
            '[[:space:]]blr[[:space:]]+x20' \
            aarch64-pthread-wrapper.dis
          awk '
            /ldp[[:space:]]+x20, x21/ { saved = NR }
            /VirtualFree/ { released = NR }
            /mov[[:space:]]+x0, x21/ { argument = NR }
            /blr[[:space:]]+x20/ { entered = NR }
            END {
              exit !(saved && released && argument && entered &&
                     saved < released && released < argument &&
                     argument < entered)
            }
          ' aarch64-pthread-wrapper.dis

          # TEB-backed TLS initialization precedes the stack switch.  The
          # common allocator path retains guard/reservation and cleanup calls.
          grep -Eq '[[:space:]]mov[[:space:]]+x0, x18' \
            aarch64-pthread-wrapper.dis
          grep -Eq '\[x18, #8\]' aarch64-pthread-wrapper.dis
          grep -Eq '\[x0, #16\]' aarch64-pthread-wrapper.dis
          for relocation in \
              CreateThread \
              VirtualAlloc \
              VirtualAlloc2 \
              VirtualFree \
              init_thread \
              api_fatal; do
            grep -Fq "$relocation" aarch64-posix-thread.relocs
          done
          awk '
            /init_thread/ { initialized = NR }
            /sub[[:space:]]+sp, x1, x[0-9]+/ { switched = NR }
            END {
              exit !(initialized && switched && initialized < switched)
            }
          ' aarch64-pthread-wrapper.dis

      - name: Compile and inspect AArch64 dcrt0 stack switch
        run: |
          compiler="$TOOLCHAIN_DIR/bin/aarch64-pc-cygwin-g++"
          objdump="$TOOLCHAIN_DIR/bin/aarch64-pc-cygwin-objdump"
          nm="$TOOLCHAIN_DIR/bin/aarch64-pc-cygwin-nm"
          "$compiler" \
            -std=gnu++17 \
            -O2 \
            -Wall \
            -Werror \
            -c \
            "$GITHUB_WORKSPACE/.github/checks/aarch64-dcrt0-stack-switch.cc" \
            -o aarch64-dcrt0-stack-switch.o
          "$objdump" -dr aarch64-dcrt0-stack-switch.o \
            | tee aarch64-dcrt0-stack-switch.dis
          "$nm" -a aarch64-dcrt0-stack-switch.o \
            | tee aarch64-dcrt0-stack-switch.symbols

          grep -Eq \
            '[[:space:]][Tt] check_dcrt0_stack_switch$' \
            aarch64-dcrt0-stack-switch.symbols
          grep -Eq \
            '[[:space:]]mov[[:space:]]+sp, x[0-9]+' \
            aarch64-dcrt0-stack-switch.dis
          grep -Eq \
            '[[:space:]]mov[[:space:]]+x29, xzr' \
            aarch64-dcrt0-stack-switch.dis
          awk '
            /mov[[:space:]]+sp, x[0-9]+/ { stack = NR }
            /mov[[:space:]]+x29, xzr/ { frame = NR }
            END { exit !(frame && stack && stack < frame) }
          ' aarch64-dcrt0-stack-switch.dis
          if grep -Eq \
              '[[:space:]]sub[[:space:]]+sp, sp, #0x20' \
              aarch64-dcrt0-stack-switch.dis; then
            exit 1
          fi

          grep -Fq '#elif defined(__aarch64__)' \
            "$GITHUB_WORKSPACE/winsup/cygwin/dcrt0.cc"
          grep -Fq 'mov sp, %[ADDR]' \
            "$GITHUB_WORKSPACE/winsup/cygwin/dcrt0.cc"
          grep -Fq 'mov fp, xzr' \
            "$GITHUB_WORKSPACE/winsup/cygwin/dcrt0.cc"
          grep -Fq '__asm__ __volatile__' \
            "$GITHUB_WORKSPACE/winsup/cygwin/dcrt0.cc"
          grep -Fq \
            'return ((PBYTE) allocationbase + stacksize - 16);' \
            "$GITHUB_WORKSPACE/winsup/cygwin/create_posix_thread.cc"

      - name: Verify AArch64 ucontext ABI model is native-only
        run: |
          # aarch64-ucontext-model.cc exercises real AArch64 signal
          # alternate-stack switching and ucontext-style makecontext
          # register/stack layout using inline asm against x18/x19/x30
          # and -ffixed-x18. It must not be compiled or executed with
          # the host's own (x86_64) g++ here: -ffixed-x18 names an
          # AArch64-only register (host g++ fails with "unknown
          # register name"), and the file itself gates on __aarch64__.
          # It is cross-compiled and linked against the real AArch64
          # Cygwin runtime in the aarch64-linker-script job below, then
          # executed natively on windows-11-arm in aarch64-runtime-smoke.
          test -f "$GITHUB_WORKSPACE/.github/checks/aarch64-ucontext-model.cc"
          grep -Fq '#if !defined(__aarch64__)' \
            "$GITHUB_WORKSPACE/.github/checks/aarch64-ucontext-model.cc"

      - name: Compile and inspect AArch64 signal and SEH paths
        run: |
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export CC=aarch64-pc-cygwin-gcc
          export CXX=aarch64-pc-cygwin-g++
          make -C build-cygtls-lock/cygwin \
            child_info_magic.h \
            shared_info_magic.h \
            globals.h

          (
            cd build-cygtls-lock/cygwin
            CXXCOMPILE="$TOOLCHAIN_DIR/bin/aarch64-pc-cygwin-g++ \
              -DHAVE_CONFIG_H \
              -I$GITHUB_WORKSPACE/build-cygtls-lock/cygwin \
              -I$GITHUB_WORKSPACE/winsup/cygwin/local_includes \
              -I$GITHUB_WORKSPACE/winsup/cygwin \
              -isystem $GITHUB_WORKSPACE/winsup/cygwin/include \
              -isystem $TOOLCHAIN_DIR/include \
              -isystem $GITHUB_WORKSPACE/newlib/targ-include \
              -isystem $GITHUB_WORKSPACE/newlib/libc/include \
              -fno-rtti \
              -fno-exceptions \
              -fno-use-cxa-atexit" \
              "$GITHUB_WORKSPACE/winsup/cygwin/scripts/gentls_offsets" \
                "$GITHUB_WORKSPACE/winsup/cygwin/local_includes/cygtls.h" \
                tlsoffsets || true
            test -s tlsoffsets
          )

          build_dir=build-cygtls-lock/cygwin
          compiler="$TOOLCHAIN_DIR/bin/aarch64-pc-cygwin-gcc"
          objdump="$TOOLCHAIN_DIR/bin/aarch64-pc-cygwin-objdump"
          nm="$TOOLCHAIN_DIR/bin/aarch64-pc-cygwin-nm"
          (
            cd "$build_dir"
            "$GITHUB_WORKSPACE/winsup/cygwin/scripts/gendef" \
              --cpu=aarch64 \
              --output-def=signal-check.def \
              "$GITHUB_WORKSPACE/winsup/cygwin/aarch64/cygwin.din" \
              "$GITHUB_WORKSPACE/winsup/cygwin/cygwin.din"
            test -s sigfe.s
          )

          source="$GITHUB_WORKSPACE/winsup/cygwin/exceptions.cc"
          test "$(grep -Fc '#error unimplemented for this target' "$source")" -eq 4
          make -C "$build_dir" \
            CXXFLAGS="-Wno-error=unused-function" \
            exceptions.o

          (
            cd "$build_dir"
            "$compiler" -c sigfe.s -o aarch64-sigfe.o
          )
          exceptions="$build_dir/exceptions.o"
          sigfe="$build_dir/aarch64-sigfe.o"
          for object in "$exceptions" "$sigfe"; do
            test -f "$object"
          done

          "$objdump" -h "$sigfe" | tee aarch64-sigfe.sections
          "$objdump" -dr "$sigfe" | tee aarch64-sigfe.dis
          "$objdump" -r "$sigfe" | tee aarch64-sigfe.relocs
          "$nm" -a "$sigfe" | tee aarch64-sigfe.symbols
          "$objdump" -h "$exceptions" | tee aarch64-exceptions.sections
          "$objdump" -dr "$exceptions" | tee aarch64-exceptions.dis
          "$objdump" -r "$exceptions" | tee aarch64-exceptions.relocs
          "$nm" -a "$exceptions" | tee aarch64-exceptions.symbols

          for section in .pdata .xdata; do
            grep -Fq "$section" aarch64-sigfe.sections
          done
          for symbol in \
              _sigfe \
              _sigfe_maybe \
              _sigbe \
              sigdelayed \
              _sigdelayed_end \
              stabilize_sig_stack \
              setjmp \
              sigsetjmp \
              longjmp \
              siglongjmp \
              _sigfe_read; do
            grep -Eq "[[:space:]][Tt] ${symbol}$" aarch64-sigfe.symbols
          done

          # The generated entry stub preserves every register clobbered before
          # RtlCaptureContext and reserves an aligned ARM64 CONTEXT frame.
          grep -Eq '[[:space:]]sub[[:space:]]+sp, sp, #0x390' \
            aarch64-sigfe.dis
          for pair in \
              'x0, x30, \[sp, #-16\]!' \
              'x16, x17, \[sp, #-16\]!'; do
            grep -Eq "[[:space:]]stp[[:space:]]+${pair}" \
              aarch64-sigfe.dis
          done
          grep -Fq 'RtlCaptureContext' aarch64-sigfe.relocs
          grep -Fq 'sigdelayed_init' aarch64-sigfe.relocs

          # setjmp/longjmp save and restore the complete nonvolatile integer
          # and SIMD state while every temporary stack adjustment stays aligned.
          for pair in \
              'x19, x20' \
              'x21, x22' \
              'x23, x24' \
              'x25, x26' \
              'x27, x28' \
              'x29, x30'; do
            grep -Eq "[[:space:]]stp[[:space:]]+${pair}," \
              aarch64-sigfe.dis
            grep -Eq "[[:space:]]ldp[[:space:]]+${pair}," \
              aarch64-sigfe.dis
          done
          for pair in \
              'd8, d9' \
              'd10, d11' \
              'd12, d13' \
              'd14, d15'; do
            grep -Eq "[[:space:]]stp[[:space:]]+${pair}," \
              aarch64-sigfe.dis
            grep -Eq "[[:space:]]ldp[[:space:]]+${pair}," \
              aarch64-sigfe.dis
          done
          if grep -Eq '[[:space:]](sub|add)[[:space:]]+sp, sp, #(0x)?[48]([[:space:]]|$)' \
              aarch64-sigfe.dis; then
            exit 1
          fi

          for relocation in \
              RtlRestoreContext \
              RtlUnwindEx; do
            grep -Fq "$relocation" aarch64-exceptions.relocs
          done
          for symbol in \
              sigdelayed_init \
              __cont_link_context \
              makecontext \
              _ZN9exception6handleEP17_EXCEPTION_RECORDPvP8_CONTEXTP25_DISPATCHER_CONTEXT_ARM64 \
              _ZN9exception7myfaultEP17_EXCEPTION_RECORDPvP8_CONTEXTP25_DISPATCHER_CONTEXT_ARM64; do
            grep -Fq "$symbol" aarch64-exceptions.symbols
          done

          # The alternate-stack call reserves the context at the aligned stack
          # top, switches through x19, and leaves the x18 TEB register alone.
          grep -B2 -A6 -m1 -E \
            'ldp[[:space:]]+x9, x0, \[x17\]' \
            aarch64-exceptions.dis > aarch64-altstack-call.dis
          test -s aarch64-altstack-call.dis
          for instruction in \
              'ldp[[:space:]]+x9, x0, \[x17\]' \
              'ldp[[:space:]]+x1, x2, \[x17, #16\]' \
              'ldp[[:space:]]+x3, x16, \[x17, #32\]' \
              'mov[[:space:]]+sp, x9' \
              'blr[[:space:]]+x16' \
              'mov[[:space:]]+sp, x19'; do
            grep -Eq "[[:space:]]${instruction}" aarch64-altstack-call.dis
          done
          if grep -Eq '(^|[^[:alnum:]_])x18([^[:alnum:]_]|$)' \
              aarch64-altstack-call.dis; then
            exit 1
          fi

          # A returned context function enters the terminal x19 trampoline.
          # Its zero-prologue SEH record covers both setcontext and exit paths.
          "$objdump" -dr --disassemble=__cont_link_context "$exceptions" \
            > aarch64-cont-link.dis
          test -s aarch64-cont-link.dis
          for instruction in \
              'mov[[:space:]]+sp, x19' \
              'ldr[[:space:]]+x0, \[x19\]' \
              'cbz[[:space:]]+x0' \
              'mov[[:space:]]+w0, #0xff' \
              'brk[[:space:]]+#(0x)?0'; do
            grep -Eq "[[:space:]]${instruction}" aarch64-cont-link.dis
          done
          grep -Fq 'setcontext' aarch64-cont-link.dis
          grep -Fq 'cygwin_exit' aarch64-cont-link.dis
          grep -Fq '__cont_link_context' aarch64-exceptions.relocs
          for section in .pdata .xdata; do
            grep -Fq "$section" aarch64-exceptions.sections
          done

          # The real makecontext object retains 64-bit variadic loads, an
          # eight-register boundary, aligned stack arguments, and LR setup.
          "$objdump" -dr --disassemble=makecontext "$exceptions" \
            > aarch64-makecontext.dis
          test -s aarch64-makecontext.dis
          grep -Eq '[[:space:]]cmp[[:space:]]+w[0-9]+, #0x7' \
            aarch64-makecontext.dis
          grep -Eq '[[:space:]]and[[:space:]]+x[0-9]+, x[0-9]+, #0xfffffffffffffff0' \
            aarch64-makecontext.dis
          grep -Fq '__cont_link_context' aarch64-makecontext.dis

      - name: Verify AArch64 processor information
        run: |
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          build_dir=build-cygtls-lock/cygwin
          objdump="$TOOLCHAIN_DIR/bin/aarch64-pc-cygwin-objdump"
          nm="$TOOLCHAIN_DIR/bin/aarch64-pc-cygwin-nm"

          make -C "$build_dir" sysconf.o fhandler/proc.o
          for object in \
             "$build_dir/sysconf.o" \
             "$build_dir/fhandler/proc.o"; do
           test -f "$object"
           name="$(basename "$object" .o)"
           "$objdump" -dr "$object" | tee "aarch64-$name.dis"
           "$objdump" -r "$object" | tee "aarch64-$name.relocs"
           "$nm" -u "$object" | tee "aarch64-$name.undefined"
           if grep -Eq \
               '(^|[[:space:]])(cpuid|mrs|msr)([[:space:]]|$)' \
               "aarch64-$name.dis"; then
             exit 1
           fi
          done

          for symbol in \
             GetCurrentProcessorNumberEx \
             GetLogicalProcessorInformationEx \
             GetProcessHeap \
             HeapAlloc \
             HeapFree; do
           grep -Eq "[[:space:]]U ${symbol}$" aarch64-sysconf.undefined
          done
          grep -Eq \
           '[[:space:]]U IsProcessorFeaturePresent$' \
           aarch64-proc.undefined
          if grep -Eq '[[:space:]]U cpuid$' \
             aarch64-sysconf.undefined aarch64-proc.undefined; then
           exit 1
          fi

          g++ \
           -std=gnu++17 \
           -O2 \
           -Wall \
           -Wextra \
           -Werror \
           "$GITHUB_WORKSPACE/.github/checks/sysconf-topology-model.cc" \
           -o sysconf-topology-model
          ./sysconf-topology-model

          "$TOOLCHAIN_DIR/bin/aarch64-pc-cygwin-gcc" \
           -std=gnu11 \
           -O2 \
           -Wall \
           -Wextra \
           -Werror \
           -c \
           "$GITHUB_WORKSPACE/.github/checks/sysconf-runtime.c" \
           -o aarch64-sysconf-runtime.o

      - name: Compile AArch64 newlib assembly checks
        run: |
          compiler="$TOOLCHAIN_DIR/bin/aarch64-pc-cygwin-gcc"
          mkdir aarch64-newlib-assembly
          for source in "$GITHUB_WORKSPACE"/newlib/libc/machine/aarch64/*.S; do
            object="aarch64-newlib-assembly/$(basename "${source%.S}").o"
            "$compiler" -O2 -c "$source" -o "$object"
          done

      - name: Compile AArch64 register context check
        run: |
          "$TOOLCHAIN_DIR/bin/aarch64-pc-cygwin-g++" \
            -std=gnu++17 \
            -Wall \
            -Werror \
            -fsyntax-only \
            -I"$GITHUB_WORKSPACE/winsup/cygwin/include" \
            -I"$GITHUB_WORKSPACE/winsup/cygwin/local_includes" \
            -I"$TOOLCHAIN_DIR/include" \
            "$GITHUB_WORKSPACE/.github/checks/aarch64-register-context.cc"

      - name: Compile AArch64 getreent check
        run: |
          "$TOOLCHAIN_DIR/bin/aarch64-pc-cygwin-gcc" \
            -std=gnu11 \
            -O2 \
            -Wall \
            -Werror \
            -c \
            -I"$GITHUB_WORKSPACE/winsup/cygwin/include" \
            "$GITHUB_WORKSPACE/.github/checks/aarch64-getreent.c" \
            -o aarch64-getreent.o

      - name: Compile AArch64 long double checks
        run: |
          compiler="$TOOLCHAIN_DIR/bin/aarch64-pc-cygwin-gcc"
          printf 'target='
          "$compiler" -dumpmachine
          "$compiler" -dM -E -x c /dev/null \
            | sort \
            | grep -E '(__aarch64__|__AARCH64EL__|__CYGWIN__|_WIN32|__SIZEOF_(DOUBLE|LONG_DOUBLE)__|__(DBL|LDBL)_(MANT_DIG|MAX_EXP)__|__BYTE_ORDER__|__FLOAT_WORD_ORDER__)'
          "$compiler" \
            -std=gnu11 \
            -O2 \
            -Wall \
            -Werror \
            -fno-builtin \
            -c \
            "$GITHUB_WORKSPACE/.github/checks/aarch64-long-double.c" \
            -o aarch64-long-double.o
          "$TOOLCHAIN_DIR/bin/aarch64-pc-cygwin-nm" -S \
            aarch64-long-double.o \
            | grep 'long_double_'
          "$compiler" \
            -std=gnu11 \
            -O2 \
            -Wall \
            -Werror \
            -c \
            "$GITHUB_WORKSPACE/winsup/cygwin/math/acosl.c" \
            -o aarch64-acosl.o
          for source in frexpl remainderl tanl; do
            "$compiler" \
              -c \
              "$GITHUB_WORKSPACE/winsup/cygwin/math/$source.S" \
              -o "aarch64-$source.o"
          done
          "$TOOLCHAIN_DIR/bin/aarch64-pc-cygwin-nm" -u \
            aarch64-acosl.o \
            aarch64-frexpl.o \
            aarch64-remainderl.o \
            aarch64-tanl.o

      - name: Compile AArch64 malloc alignment checks
        run: |
          compiler="$TOOLCHAIN_DIR/bin/aarch64-pc-cygwin-gcc"
          "$compiler" \
            -std=gnu11 \
            -O2 \
            -Wall \
            -Werror \
            -I"$GITHUB_WORKSPACE/winsup/cygwin/local_includes" \
            -isystem "$GITHUB_WORKSPACE/newlib/libc/include" \
            -c \
            "$GITHUB_WORKSPACE/.github/checks/aarch64-malloc-alignment.c" \
            -o aarch64-malloc-alignment.o
          "$TOOLCHAIN_DIR/bin/aarch64-pc-cygwin-nm" -S \
            aarch64-malloc-alignment.o \
            | grep 'checked_.*_alignment'

  aarch64-linker-script:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: setup-msys2
        uses: msys2/setup-msys2@v2
        with:
          location: ${{ runner.temp }}\aarch64-msys-toolchain
          msystem: MSYS
          update: true
          # autotools provides /usr/bin/aclocal, /usr/bin/autoconf, and
          # /usr/bin/automake, which winsup/autogen.sh invokes directly
          # below. It is already part of the (passing) x86_64 build job's
          # package list; this job was simply missing it, causing a
          # pre-existing, deterministic "aclocal: No such file or
          # directory" failure here (reproduced on the unmodified base
          # branch as well, unrelated to the AArch64 wsock autoload fix).
          install: autotools base-devel cocom gcc git gmp isl libiconv libintl libzstd mpc mpfr zlib

      - name: Install fork-local AArch64 runtime toolchain
        shell: msys2 {0}
        run: ./.github/checks/install-aarch64-runtime-toolchain.sh

      - name: Validate AArch64 linker script and PE image
        shell: msys2 {0}
        run: |
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          ./.github/checks/validate-aarch64-linker-script.sh \
            aarch64-linker-validation

      - name: Build and validate AArch64 MSYS runtime
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export ac_cv_lib_sframe_sframe_decode=no
          export ac_cv_lib_zstd_ZSTD_isError=no

          (cd winsup && ./autogen.sh)
          mkdir build-aarch64-runtime
          (
            cd build-aarch64-runtime
            ../configure \
              --target=aarch64-pc-cygwin \
              --prefix="$PWD/install" \
              --with-cross-bootstrap \
              --disable-doc \
              CFLAGS_FOR_TARGET="-O2 -g -D__MSYS__" \
              CXXFLAGS_FOR_TARGET="-O2 -g -D__MSYS__"
          )
          make -C build-aarch64-runtime -j"$(nproc)" all-target-newlib
          make -C build-aarch64-runtime configure-target-winsup
          make -C build-aarch64-runtime/aarch64-pc-cygwin/winsup/cygwin \
            -j"$(nproc)"

          cygwin_build="$PWD/build-aarch64-runtime/aarch64-pc-cygwin/winsup/cygwin"
          gccdir="$(aarch64-pc-cygwin-gcc -print-file-name=libgcc.a)"
          gccdir="$(dirname "$gccdir")"
          aarch64-pc-cygwin-gcc \
            -D__MSYS__ \
            -O2 \
            -g \
            -Wall \
            -Werror \
            -c .github/checks/aarch64-runtime-smoke.c \
            -o "$cygwin_build/aarch64-runtime-smoke.o"
          aarch64-pc-cygwin-gcc \
            -nostdlib \
            -Wl,--no-insert-timestamp \
            -Wl,--subsystem,console \
            -Wl,-e,mainCRTStartup \
            -o "$cygwin_build/aarch64-runtime-smoke.exe" \
            "$cygwin_build/crt0.o" \
            "$gccdir/crtbegin.o" \
            "$cygwin_build/aarch64-runtime-smoke.o" \
            -L"$cygwin_build" \
            -Wl,--start-group \
            -lmsys-2.0 \
            -lgcc_s \
            -lgcc \
            -Wl,--end-group \
            "$gccdir/crtend.o" \
            "$TARGET_ROOT/lib/default-manifest.o" \
            -lkernel32 \
            -lntdll

          for source in aarch64-process-regression aarch64-argv-dump; do
            aarch64-pc-cygwin-gcc \
              -D__MSYS__ \
              -O2 \
              -g \
              -Wall \
              -Wextra \
              -Werror \
              -fno-builtin-strchr \
              -c ".github/checks/$source.c" \
              -o "$cygwin_build/$source.o"
            aarch64-pc-cygwin-gcc \
              -nostdlib \
              -Wl,--no-insert-timestamp \
              -Wl,--subsystem,console \
              -Wl,-e,mainCRTStartup \
              -o "$cygwin_build/$source.exe" \
              "$cygwin_build/crt0.o" \
              "$gccdir/crtbegin.o" \
              "$cygwin_build/$source.o" \
              -L"$cygwin_build" \
              -Wl,--start-group \
              -lmsys-2.0 \
              -lgcc_s \
              -lgcc \
              -Wl,--end-group \
              "$gccdir/crtend.o" \
              "$TARGET_ROOT/lib/default-manifest.o" \
              -lkernel32 \
              -lntdll
          done

          aarch64-pc-cygwin-gcc \
            -D__MSYS__ \
            -O2 \
            -g \
            -Wall \
            -Werror \
            -c .github/checks/aarch64-wsock-autoload-smoke.c \
            -o "$cygwin_build/aarch64-wsock-autoload-smoke.o"
          aarch64-pc-cygwin-gcc \
            -nostdlib \
            -Wl,--no-insert-timestamp \
            -Wl,--subsystem,console \
            -Wl,-e,mainCRTStartup \
            -o "$cygwin_build/aarch64-wsock-autoload-smoke.exe" \
            "$cygwin_build/crt0.o" \
            "$gccdir/crtbegin.o" \
            "$cygwin_build/aarch64-wsock-autoload-smoke.o" \
            -L"$cygwin_build" \
            -Wl,--start-group \
            -lmsys-2.0 \
            -lgcc_s \
            -lgcc \
            -Wl,--end-group \
            "$gccdir/crtend.o" \
            "$TARGET_ROOT/lib/default-manifest.o" \
            -lkernel32 \
            -lntdll

          # Cross-compile and link the AArch64 endian-primitives runtime
          # check against the real Cygwin runtime, so it can be executed
          # natively on windows-11-arm in aarch64-runtime-smoke below,
          # instead of with the host's own (x86_64) gcc, which can never
          # define __aarch64__ or run the resulting binary.
          aarch64-pc-cygwin-gcc \
            -std=gnu11 \
            -O2 \
            -Wall \
            -Wextra \
            -Werror \
            -c .github/checks/aarch64-endian-runtime.c \
            -o "$cygwin_build/aarch64-endian-runtime.o"
          aarch64-pc-cygwin-gcc \
            -nostdlib \
            -Wl,--no-insert-timestamp \
            -Wl,--subsystem,console \
            -Wl,-e,mainCRTStartup \
            -o "$cygwin_build/aarch64-endian-runtime.exe" \
            "$cygwin_build/crt0.o" \
            "$gccdir/crtbegin.o" \
            "$cygwin_build/aarch64-endian-runtime.o" \
            -L"$cygwin_build" \
            -Wl,--start-group \
            -lmsys-2.0 \
            -lgcc_s \
            -lgcc \
            -Wl,--end-group \
            "$gccdir/crtend.o" \
            "$TARGET_ROOT/lib/default-manifest.o" \
            -lkernel32 \
            -lntdll

          # Cross-compile and link the AArch64 ucontext ABI model check
          # against the real Cygwin runtime, so it can be executed
          # natively on windows-11-arm in aarch64-runtime-smoke below,
          # instead of with the host's own (x86_64) g++, which can
          # never accept -ffixed-x18 (an AArch64-only register name)
          # or define __aarch64__.
          aarch64-pc-cygwin-g++ \
            -std=gnu++17 \
            -O2 \
            -Wall \
            -Wextra \
            -Werror \
            -ffixed-x18 \
            -c .github/checks/aarch64-ucontext-model.cc \
            -o "$cygwin_build/aarch64-ucontext-model.o"
          aarch64-pc-cygwin-g++ \
            -nostdlib \
            -Wl,--no-insert-timestamp \
            -Wl,--subsystem,console \
            -Wl,-e,mainCRTStartup \
            -o "$cygwin_build/aarch64-ucontext-model.exe" \
            "$cygwin_build/crt0.o" \
            "$gccdir/crtbegin.o" \
            "$cygwin_build/aarch64-ucontext-model.o" \
            -L"$cygwin_build" \
            -Wl,--start-group \
            -lmsys-2.0 \
            -lgcc_s \
            -lgcc \
            -Wl,--end-group \
            "$gccdir/crtend.o" \
            "$TARGET_ROOT/lib/default-manifest.o" \
            -lkernel32 \
            -lntdll

          cp "$cygwin_build/new-msys-2.0.dll" \
            "$cygwin_build/new-msys-2.0.first.dll"
          cp "$cygwin_build/libmsys-2.0.a" \
            "$cygwin_build/libmsys-2.0.first.a"
          rm "$cygwin_build/new-msys-2.0.dll" \
            "$cygwin_build/msysdll.a" \
            "$cygwin_build/libmsys-2.0.a"
          make -C "$cygwin_build" -j"$(nproc)"
          cmp "$cygwin_build/new-msys-2.0.first.dll" \
            "$cygwin_build/new-msys-2.0.dll"
          cmp "$cygwin_build/libmsys-2.0.first.a" \
            "$cygwin_build/libmsys-2.0.a"

          ./.github/checks/validate-aarch64-runtime.sh \
            build-aarch64-runtime \
            aarch64-runtime-validation
          ./.github/checks/validate-aarch64-public-abi.sh \
            build-aarch64-runtime \
            aarch64-runtime-validation
          cp "$cygwin_build/new-msys-2.0.dll" \
            aarch64-runtime-validation/msys-2.0.dll
          cp "$TOOLCHAIN_DIR/lib/gcc/aarch64-pc-msys/msys-gcc_s-seh-1.dll" \
            aarch64-runtime-validation/
          cp "$cygwin_build/libmsys-2.0.a" \
            aarch64-runtime-validation/libmsys-2.0.a
          cp "$cygwin_build/aarch64-runtime-smoke.exe" \
            aarch64-runtime-validation/
          cp "$cygwin_build/aarch64-wsock-autoload-smoke.exe" \
            aarch64-runtime-validation/
          cp "$cygwin_build/aarch64-endian-runtime.exe" \
            aarch64-runtime-validation/
          cp "$cygwin_build/aarch64-ucontext-model.exe" \
            aarch64-runtime-validation/
          cp "$cygwin_build/aarch64-process-regression.exe" \
             "$cygwin_build/aarch64-argv-dump.exe" \
             aarch64-runtime-validation/
          cp .github/checks/run-aarch64-argv-regression.ps1 \
             aarch64-runtime-validation/
          mkdir aarch64-runtime-validation/a527-baseline
          cp "$TOOLCHAIN_DIR/aarch64-pc-msys/bin/msys-2.0.dll" \
             aarch64-runtime-validation/a527-baseline/
          cp "$cygwin_build/aarch64-process-regression.exe" \
             "$cygwin_build/aarch64-argv-dump.exe" \
             aarch64-runtime-validation/a527-baseline/
          cp .github/checks/run-aarch64-argv-regression.ps1 \
             aarch64-runtime-validation/a527-baseline/

      - name: Upload AArch64 runtime validation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aarch64-runtime-validation
          path: |
            aarch64-linker-validation/
            aarch64-runtime-validation/

  aarch64-runtime-smoke:
    needs: aarch64-linker-script
    runs-on: windows-11-arm

    steps:
      - name: Download AArch64 runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download $env:GITHUB_RUN_ID `
            --repo $env:GITHUB_REPOSITORY `
            --name aarch64-runtime-validation `
            --dir aarch64-runtime-validation

      - name: Run AArch64 runtime startup smoke test
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne
              [System.Runtime.InteropServices.Architecture]::Arm64) {
            throw "A native Windows ARM64 runner is required"
          }
          $runtime = (Resolve-Path `
            aarch64-runtime-validation/aarch64-runtime-validation).Path
          & (Join-Path $runtime "aarch64-runtime-smoke.exe")
          if ($LASTEXITCODE -ne 0) {
            throw "AArch64 runtime smoke test failed with exit code $LASTEXITCODE"
          }

      - name: Run AArch64 wsock autoload regression probe
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne
              [System.Runtime.InteropServices.Architecture]::Arm64) {
            throw "A native Windows ARM64 runner is required"
          }
          # Run in its own fresh process (not appended to the shared smoke
          # test) so `socket`/`WSAEventSelect` are still unresolved ws2_32
          # autoload trampolines and must go through _wsock_init.
          $runtime = (Resolve-Path `
            aarch64-runtime-validation/aarch64-runtime-validation).Path
          & (Join-Path $runtime "aarch64-wsock-autoload-smoke.exe")
          if ($LASTEXITCODE -ne 0) {
            throw "AArch64 wsock autoload regression probe failed with exit code $LASTEXITCODE"
          }

      - name: Run AArch64 endian primitives runtime check
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne
              [System.Runtime.InteropServices.Architecture]::Arm64) {
            throw "A native Windows ARM64 runner is required"
          }
          $runtime = (Resolve-Path `
            aarch64-runtime-validation/aarch64-runtime-validation).Path
          & (Join-Path $runtime "aarch64-endian-runtime.exe")
          if ($LASTEXITCODE -ne 0) {
            throw "AArch64 endian primitives runtime check failed with exit code $LASTEXITCODE"
          }

      - name: Run AArch64 ucontext ABI model
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne
              [System.Runtime.InteropServices.Architecture]::Arm64) {
            throw "A native Windows ARM64 runner is required"
          }
          $runtime = (Resolve-Path `
            aarch64-runtime-validation/aarch64-runtime-validation).Path
          & (Join-Path $runtime "aarch64-ucontext-model.exe")
          if ($LASTEXITCODE -ne 0) {
            throw "AArch64 ucontext ABI model check failed with exit code $LASTEXITCODE"
          }

      - name: Run AArch64 public ABI regression probes
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne
              [System.Runtime.InteropServices.Architecture]::Arm64) {
            throw "A native Windows ARM64 runner is required"
          }
          $runtime = (Resolve-Path `
            aarch64-runtime-validation/aarch64-runtime-validation).Path
          foreach ($probe in @(
              "aarch64-pthread-initializers.exe",
              "aarch64-ctype-compat.exe")) {
            & (Join-Path $runtime $probe)
            if ($LASTEXITCODE -ne 0) {
              throw "$probe failed with exit code $LASTEXITCODE"
            }
          }

      - name: Reproduce immutable a527 argv and process failures
        if: always()
        shell: pwsh
        run: |
          $runtime = (Resolve-Path `
            aarch64-runtime-validation/aarch64-runtime-validation).Path
          $baseline = Join-Path $runtime "a527-baseline"
          $env:MSYS2_ARM64_HANDLE_DIAGNOSTICS = "1"

          & (Join-Path $baseline "run-aarch64-argv-regression.ps1") `
            -RuntimePath $baseline -ExpectCorruption

          & (Join-Path $baseline "aarch64-process-regression.exe") 2>&1 |
            Tee-Object -FilePath (Join-Path $baseline "expected-process-failure.txt")
          if ($LASTEXITCODE -eq 0) {
            throw "immutable a527 unexpectedly passed the process regression"
          }

      - name: Run AArch64 argv regression matrix
        if: always()
        shell: pwsh
        run: |
          $runtime = (Resolve-Path `
            aarch64-runtime-validation/aarch64-runtime-validation).Path
          & (Join-Path $runtime "run-aarch64-argv-regression.ps1") `
            -RuntimePath $runtime

      - name: Run AArch64 process regression probe
        if: always()
        shell: pwsh
        run: |
          $runtime = (Resolve-Path `
            aarch64-runtime-validation/aarch64-runtime-validation).Path
          $env:MSYS2_ARM64_HANDLE_DIAGNOSTICS = "1"
          & (Join-Path $runtime "aarch64-process-regression.exe")
          if ($LASTEXITCODE -ne 0) {
            throw "AArch64 process regression probe failed with exit code $LASTEXITCODE"
          }

      - name: Upload native AArch64 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aarch64-native-runtime-evidence
          path: |
            aarch64-runtime-validation/aarch64-runtime-validation/*.txt
            aarch64-runtime-validation/aarch64-runtime-validation/a527-baseline/*.txt

  configure-winsup:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-cygwin
          - aarch64-pc-cygwin

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate winsup configure
        working-directory: winsup
        run: ./autogen.sh

      - name: Configure winsup for ${{ matrix.target }}
        env:
          ac_cv_lib_sframe_sframe_decode: "no"
          ac_cv_lib_zstd_ZSTD_isError: "no"
        run: |
          mkdir build-winsup
          cd build-winsup
          ../winsup/configure \
            --target=${{ matrix.target }} \
            --with-cross-bootstrap \
            --disable-doc

          case "${{ matrix.target }}" in
            aarch64-*)
              cppflags="-D__aarch64__ -U__x86_64__"
              format=pei-aarch64-little
              ;;
            x86_64-*)
              cppflags="-D__x86_64__ -U__aarch64__"
              format=pei-x86-64
              ;;
          esac

          make -C cygwin cygwin.sc CC="gcc $cppflags -U__MSYS__"
          mv cygwin/cygwin.sc cygwin/cygwin-cygwin.sc
          make -C cygwin cygwin.sc CC="gcc $cppflags -D__MSYS__"
          mv cygwin/cygwin.sc cygwin/cygwin-msys.sc

          cmp cygwin/cygwin-cygwin.sc cygwin/cygwin-msys.sc
          grep -Fxq "OUTPUT_FORMAT($format)" cygwin/cygwin-cygwin.sc
          test "$(
            grep -Fxc 'SEARCH_DIR("=/usr/lib/w32api")' \
              cygwin/cygwin-cygwin.sc
          )" -eq 1

  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Capture x86_64 assembly baselines
        shell: pwsh
        run: |
          git show `
            5b38980d0c363dd3bdd2f542d64a4e8a38d4d81f:winsup/cygwin/autoload.cc `
            > x86_64-autoload-base.cc
          git show `
            37a88c50ccf3bf9afd962055cfcbb8255ae2cda6:winsup/cygwin/create_posix_thread.cc `
            > x86_64-create-posix-thread-base.cc
          git show `
            088c23f90d80451379d9a3b16b6598f9e6f10f45:winsup/cygwin/dcrt0.cc `
            > x86_64-dcrt0-base.cc
          git show `
            4705528ab7c32a921a08def1bb8414a31deb75f5:winsup/cygwin/scripts/gendef `
            > x86_64-gendef-base
          git show `
            6357de10efd55101cc1de06fb500eb24b09aa3dc:winsup/cygwin/exceptions.cc `
            > x86_64-exceptions-base.cc
          git show `
            a4cf6657c61eb8ae02e5b6839cd34a896d8316d4:winsup/cygwin/include/machine/_endian.h `
            > x86_64-endian-base.h
          git show `
            67417ca1f1ec9558d144f295c474d679c28d4a6e:winsup/cygwin/local_includes/cpuid.h `
            > x86_64-cpuid-base.h
          git show HEAD:winsup/cygwin/scripts/gendef > x86_64-gendef-current

      - name: setup-msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: msys2-devel base-devel autotools cocom diffutils gcc gettext-devel libiconv-devel make mingw-w64-cross-crt mingw-w64-cross-gcc mingw-w64-cross-zlib perl zlib-devel xmlto docbook-xsl libzstd-devel

      - name: Build
        shell: msys2 {0}
        run: |
          (cd winsup && ./autogen.sh)
          ./configure --disable-dependency-tracking --with-msys2-runtime-commit="$GITHUB_SHA"
          make -j8

      - name: Verify x86_64 CPUID helpers are unchanged
        shell: msys2 {0}
        run: |
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir "$work/base"
          cp "$PWD/x86_64-cpuid-base.h" "$work/base/cpuid.h"

          for version in base current; do
            include="$PWD/winsup/cygwin/local_includes"
            if test "$version" = base; then
              include="$work/base"
            fi
            g++ \
              -std=gnu++17 \
              -O2 \
              -Wall \
              -Wextra \
              -Werror \
              -I"$include" \
              -c \
              "$PWD/.github/checks/x86-cpuid.cc" \
              -o "$work/$version.o"
            objcopy --dump-section .text="$work/$version.bin" \
              "$work/$version.o"
          done

          cmp "$work/base.bin" "$work/current.bin"
          objdump -dr "$work/current.o" | tee x86_64-cpuid.dis
          grep -Eq '[[:space:]]cpuid([[:space:]]|$)' x86_64-cpuid.dis
          grep -Eq '[[:space:]]pushf([[:space:]]|$)' x86_64-cpuid.dis
          grep -Eq '[[:space:]]popf([[:space:]]|$)' x86_64-cpuid.dis

      - name: Verify x86_64 endian primitives
        shell: msys2 {0}
        run: |
          cygwin_build_dir="$(
            dirname "$(
              find . -path '*/winsup/cygwin/config.h' -print -quit
            )"
          )"
          source_file="$PWD/winsup/cygwin/include/machine/_endian.h"
          backup="$(mktemp)"
          cp "$source_file" "$backup"
          trap 'cp "$backup" "$source_file"; rm -f "$backup"' EXIT

          compile_endian_check()
          {
            gcc \
              -std=gnu11 \
              -O2 \
              -Wall \
              -Wextra \
              -Werror \
              -I"$cygwin_build_dir" \
              -isystem "$PWD/winsup/cygwin/include" \
              -isystem "$PWD/newlib/targ-include" \
              -isystem "$PWD/newlib/libc/include" \
              "$@"
          }

          compile_endian_check \
            "$PWD/.github/checks/endian-primitives.c" \
            -o x86_64-endian-primitives.exe
          ./x86_64-endian-primitives.exe
          compile_endian_check \
            -c "$PWD/.github/checks/endian-primitives.c" \
            -o x86_64-endian-current.o
          objcopy --dump-section .text=x86_64-endian-current.bin \
            x86_64-endian-current.o

          cp "$PWD/x86_64-endian-base.h" "$source_file"
          compile_endian_check \
            -c "$PWD/.github/checks/endian-primitives.c" \
            -o x86_64-endian-base.o
          objcopy --dump-section .text=x86_64-endian-base.bin \
            x86_64-endian-base.o

          cp "$backup" "$source_file"
          rm -f "$backup"
          trap - EXIT

          test -s x86_64-endian-current.bin
          test -s x86_64-endian-base.bin
          cmp x86_64-endian-base.bin x86_64-endian-current.bin
          objdump -dr x86_64-endian-current.o \
            | tee x86_64-endian-primitives.dis
          objdump -dr --disassemble=checked_ntohs \
            x86_64-endian-current.o \
            | grep -Eq '[[:space:]]xchg[[:space:]]+%a[lh], *%a[lh]'
          objdump -dr --disassemble=checked_ntohl \
            x86_64-endian-current.o \
            | grep -Eq '[[:space:]]bswap[[:space:]]+%e[a-z]+'

      - name: Verify x86_64 signal stubs are byte-for-byte unchanged
        shell: msys2 {0}
        run: |
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir "$work/base" "$work/current"

          cp "$GITHUB_WORKSPACE/x86_64-gendef-base" "$work/base/gendef"
          cp "$GITHUB_WORKSPACE/x86_64-gendef-current" "$work/current/gendef"
          for version in base current; do
            (
              cd "$work/$version"
              perl ./gendef \
                --cpu=x86_64 \
                --output-def=cygwin.def \
                "$GITHUB_WORKSPACE/winsup/cygwin/cygwin.din"
            )
          done

          cmp "$work/base/cygwin.def" "$work/current/cygwin.def"
          cmp "$work/base/sigfe.s" "$work/current/sigfe.s"

      - name: Verify x86_64 exception code is unchanged
        shell: msys2 {0}
        run: |
          cygwin_build_dir="$(
            dirname "$(
              find . -path '*/winsup/cygwin/config.h' -print -quit
            )"
          )"
          source_file="$PWD/winsup/cygwin/exceptions.cc"
          object="$cygwin_build_dir/exceptions.o"
          backup="$(mktemp)"
          cp "$source_file" "$backup"
          trap 'cp "$backup" "$source_file"; touch "$source_file"; rm -f "$backup"' EXIT

          test -f "$object"
          objdump -dr "$object" \
            | sed '1,/Disassembly of section/d' \
            | sed -E '/c7 44 24 28/{ s/(c7 44 24 28) [0-9a-f]{2} [0-9a-f]{2} [0-9a-f]{2}/\1 XX XX XX/; s/[$]0x[0-9a-f]+/LINE/; }' \
            > x86_64-exceptions-current.dis

          cp "$PWD/x86_64-exceptions-base.cc" "$source_file"
          touch "$source_file"
          make -C "$cygwin_build_dir" exceptions.o
          objdump -dr "$object" \
            | sed '1,/Disassembly of section/d' \
            | sed -E '/c7 44 24 28/{ s/(c7 44 24 28) [0-9a-f]{2} [0-9a-f]{2} [0-9a-f]{2}/\1 XX XX XX/; s/[$]0x[0-9a-f]+/LINE/; }' \
            > x86_64-exceptions-base.dis
          cmp x86_64-exceptions-base.dis x86_64-exceptions-current.dis

          cp "$backup" "$source_file"
          touch "$source_file"
          make -C "$cygwin_build_dir" exceptions.o
          rm -f "$backup"
          trap - EXIT

      - name: Disassemble x86_64 cygtls lock
        shell: msys2 {0}
        run: |
          cygwin_build_dir="$(
            dirname "$(
              find . -path '*/winsup/cygwin/config.h' -print -quit
            )"
          )"
          test -f "$cygwin_build_dir/config.h"
          make -C "$cygwin_build_dir" globals.h

          g++ \
            -DHAVE_CONFIG_H \
            -I"$cygwin_build_dir" \
            -I"$PWD/winsup/cygwin/local_includes" \
            -I"$PWD/winsup/cygwin" \
            -isystem "$PWD/winsup/cygwin/include" \
            -isystem "$PWD/newlib/targ-include" \
            -isystem "$PWD/newlib/libc/include" \
            -fno-rtti \
            -fno-exceptions \
            -fno-use-cxa-atexit \
            -Wall \
            -Werror \
            -O2 \
            -c \
            "$PWD/.github/checks/cygtls-lock.cc" \
            -o x86_64-cygtls-lock.o
          objdump -d x86_64-cygtls-lock.o | tee x86_64-cygtls-lock.dis
          grep -Eq '[[:space:]]pause([[:space:]]|$)' \
            x86_64-cygtls-lock.dis
          if grep -Eq '[[:space:]](dmb|yield)([[:space:]]|$)' \
              x86_64-cygtls-lock.dis; then
            exit 1
          fi

      - name: Verify x86_64 autoload assembly is unchanged
        shell: msys2 {0}
        run: |
          cygwin_build_dir="$(
            dirname "$(
              find . -path '*/winsup/cygwin/config.h' -print -quit
            )"
          )"
          source_file="$PWD/winsup/cygwin/autoload.cc"
          object="$cygwin_build_dir/autoload.o"
          backup="$(mktemp)"
          cp "$source_file" "$backup"
          trap 'cp "$backup" "$source_file"; touch "$source_file"; rm -f "$backup"' EXIT

          test -f "$object"
          objdump -dr "$object" \
            | sed '1,/Disassembly of section/d' \
            > x86_64-autoload-current.dis

          cp "$PWD/x86_64-autoload-base.cc" "$source_file"
          touch "$source_file"
          make -C "$cygwin_build_dir" autoload.o
          objdump -dr "$object" \
            | sed '1,/Disassembly of section/d' \
            > x86_64-autoload-base.dis
          cmp x86_64-autoload-base.dis x86_64-autoload-current.dis

          cp "$backup" "$source_file"
          touch "$source_file"
          make -C "$cygwin_build_dir" autoload.o
          rm -f "$backup"
          trap - EXIT

      - name: Verify x86_64 POSIX thread startup is unchanged
        shell: msys2 {0}
        run: |
          cygwin_build_dir="$(
            dirname "$(
              find . -path '*/winsup/cygwin/config.h' -print -quit
            )"
          )"
          source_file="$PWD/winsup/cygwin/create_posix_thread.cc"
          object="$cygwin_build_dir/create_posix_thread.o"
          backup="$(mktemp)"
          cp "$source_file" "$backup"
          trap 'cp "$backup" "$source_file"; touch "$source_file"; rm -f "$backup"' EXIT

          test -f "$object"
          objdump -dr "$object" \
            | sed '1,/Disassembly of section/d' \
            > x86_64-create-posix-thread-current.dis

          cp "$PWD/x86_64-create-posix-thread-base.cc" "$source_file"
          touch "$source_file"
          make -C "$cygwin_build_dir" create_posix_thread.o
          objdump -dr "$object" \
            | sed '1,/Disassembly of section/d' \
            > x86_64-create-posix-thread-base.dis
          cmp \
            x86_64-create-posix-thread-base.dis \
            x86_64-create-posix-thread-current.dis

          cp "$backup" "$source_file"
          touch "$source_file"
          make -C "$cygwin_build_dir" create_posix_thread.o
          rm -f "$backup"
          trap - EXIT

      - name: Verify x86_64 dcrt0 startup is unchanged
        shell: msys2 {0}
        run: |
          cygwin_build_dir="$(
            dirname "$(
              find . -path '*/winsup/cygwin/config.h' -print -quit
            )"
          )"
          source_file="$PWD/winsup/cygwin/dcrt0.cc"
          object="$cygwin_build_dir/dcrt0.o"
          backup="$(mktemp)"
          cp "$source_file" "$backup"
          trap 'cp "$backup" "$source_file"; touch "$source_file"; rm -f "$backup"' EXIT

          test -f "$object"
          objdump -dr "$object" \
            | sed '1,/Disassembly of section/d' \
            > x86_64-dcrt0-current.dis

          cp "$PWD/x86_64-dcrt0-base.cc" "$source_file"
          touch "$source_file"
          make -C "$cygwin_build_dir" dcrt0.o
          objdump -dr "$object" \
            | sed '1,/Disassembly of section/d' \
            > x86_64-dcrt0-base.dis
          cmp x86_64-dcrt0-base.dis x86_64-dcrt0-current.dis

          cp "$backup" "$source_file"
          touch "$source_file"
          make -C "$cygwin_build_dir" dcrt0.o
          rm -f "$backup"
          trap - EXIT

      - name: Install
        shell: msys2 {0}
        run: |
          make DESTDIR="$(pwd)"/_dest install

      - name: Verify native sysconf and getconf
        shell: msys2 {0}
        run: |
          runtime_dir="$PWD/_dest/usr/bin"
          test -f "$runtime_dir/msys-2.0.dll"
          test -f "$runtime_dir/getconf.exe"

          gcc \
            -std=gnu11 \
            -O2 \
            -Wall \
            -Wextra \
            -Werror \
            "$PWD/.github/checks/sysconf-runtime.c" \
            -o "$runtime_dir/sysconf-runtime.exe"
          "$runtime_dir/sysconf-runtime.exe"

          configured="$("$runtime_dir/getconf.exe" _NPROCESSORS_CONF)"
          online="$("$runtime_dir/getconf.exe" _NPROCESSORS_ONLN)"
          page_size="$("$runtime_dir/getconf.exe" PAGESIZE)"
          test "$configured" -ge "$online"
          test "$online" -gt 0
          test "$page_size" -gt 0

          for name in \
              LEVEL1_ICACHE_SIZE \
              LEVEL1_ICACHE_LINESIZE \
              LEVEL1_DCACHE_SIZE \
              LEVEL1_DCACHE_LINESIZE \
              LEVEL2_CACHE_SIZE \
              LEVEL2_CACHE_LINESIZE \
              LEVEL3_CACHE_SIZE \
              LEVEL3_CACHE_LINESIZE \
              LEVEL4_CACHE_SIZE \
              LEVEL4_CACHE_LINESIZE; do
            value="$("$runtime_dir/getconf.exe" "$name")"
            test "$value" -ge 0
          done

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: install
          path: _dest/

  generate-msys2-tests-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        uses: msys2/msys2-tests/gha-matrix-gen@main

  msys2-tests:
    needs: [build, generate-msys2-tests-matrix]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-msys2-tests-matrix.outputs.matrix) }}

    name: msys2-tests ${{ matrix.msystem }}-${{ matrix.cc }}
    runs-on: ${{ matrix.runner }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      FC: ${{ matrix.fc }}
    steps:
      - id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.packages }}

      - name: Add staging repo
        shell: msys2 {0}
        run: |
          sed -i '1s|^|[staging]\nServer = https://repo.msys2.org/staging/\nSigLevel = Never\n|' /etc/pacman.conf

      - name: Update using staging
        shell: pwsh
        run: |
          msys2 -c 'pacman --noconfirm -Suuy'
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          msys2 -c 'pacman --noconfirm -Suu'

      - name: Download msys2-runtime artifact
        uses: actions/download-artifact@v8
        with:
          name: install
          path: ${{ steps.msys2.outputs.msys2-location }}

      - name: uname -a
        shell: msys2 {0}
        run: uname -a

      - name: Run tests
        uses: msys2/msys2-tests@main
