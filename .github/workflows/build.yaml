name: build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  aarch64-register-context:
    runs-on: ubuntu-latest
    env:
      TOOLCHAIN_DIR: ${{ github.workspace }}/aarch64-pc-cygwin-toolchain

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf automake gawk make

      - name: Download AArch64 Cygwin toolchain
        run: |
          curl --fail --location --retry 3 \
            --output aarch64-pc-cygwin-toolchain.tar.gz \
            https://github.com/Windows-on-ARM-Experiments/mingw-woarm64-build/releases/download/2025-07-15/aarch64-pc-cygwin-msvcrt-toolchain.tar.gz
          echo "1ec7c5db7d6f2b9f8c9e9f631b05a5de27b83b98297b3a2043172f569820d1f3  aarch64-pc-cygwin-toolchain.tar.gz" \
            | sha256sum --check
          mkdir -p "$TOOLCHAIN_DIR"
          tar -xzf aarch64-pc-cygwin-toolchain.tar.gz -C "$TOOLCHAIN_DIR"

      - name: Compile AArch64 register context check
        run: |
          "$TOOLCHAIN_DIR/bin/aarch64-pc-cygwin-g++" \
            -std=gnu++17 \
            -Wall \
            -Werror \
            -fsyntax-only \
            -I"$GITHUB_WORKSPACE/winsup/cygwin/include" \
            -I"$GITHUB_WORKSPACE/winsup/cygwin/local_includes" \
            -I"$TOOLCHAIN_DIR/include" \
            "$GITHUB_WORKSPACE/.github/checks/aarch64-register-context.cc"

      - name: Probe the next AArch64 build blocker
        continue-on-error: true
        env:
          CXXFLAGS_FOR_TARGET: -I${{ github.workspace }}/aarch64-pc-cygwin-toolchain/include
          LDFLAGS_FOR_TARGET: -L${{ github.workspace }}/aarch64-pc-cygwin-toolchain/lib
          PATH: ${{ github.workspace }}/aarch64-pc-cygwin-toolchain/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          (cd winsup && ./autogen.sh)
          mkdir build-aarch64
          cd build-aarch64
          ../configure \
            --target=aarch64-pc-cygwin \
            --disable-doc \
            --disable-dumper \
            --with-cross-bootstrap
          make V=1 -j2 2>&1 | tee aarch64-build.log

      - name: Upload AArch64 build probe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aarch64-build-probe
          path: build-aarch64/aarch64-build.log

  configure-winsup:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-cygwin
          - aarch64-pc-cygwin

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate winsup configure
        working-directory: winsup
        run: ./autogen.sh

      - name: Configure winsup for ${{ matrix.target }}
        env:
          ac_cv_lib_sframe_sframe_decode: "no"
          ac_cv_lib_zstd_ZSTD_isError: "no"
        run: |
          mkdir build-winsup
          cd build-winsup
          ../winsup/configure \
            --target=${{ matrix.target }} \
            --with-cross-bootstrap \
            --disable-doc

  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: setup-msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: msys2-devel base-devel autotools cocom diffutils gcc gettext-devel libiconv-devel make mingw-w64-cross-crt mingw-w64-cross-gcc mingw-w64-cross-zlib perl zlib-devel xmlto docbook-xsl libzstd-devel

      - name: Build
        shell: msys2 {0}
        run: |
          (cd winsup && ./autogen.sh)
          ./configure --disable-dependency-tracking --with-msys2-runtime-commit="$GITHUB_SHA"
          make -j8

      - name: Install
        shell: msys2 {0}
        run: |
          make DESTDIR="$(pwd)"/_dest install

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: install
          path: _dest/

  generate-msys2-tests-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        uses: msys2/msys2-tests/gha-matrix-gen@main

  msys2-tests:
    needs: [build, generate-msys2-tests-matrix]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-msys2-tests-matrix.outputs.matrix) }}

    name: msys2-tests ${{ matrix.msystem }}-${{ matrix.cc }}
    runs-on: ${{ matrix.runner }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      FC: ${{ matrix.fc }}
    steps:
      - id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.packages }}

      - name: Add staging repo
        shell: msys2 {0}
        run: |
          sed -i '1s|^|[staging]\nServer = https://repo.msys2.org/staging/\nSigLevel = Never\n|' /etc/pacman.conf

      - name: Update using staging
        shell: pwsh
        run: |
          msys2 -c 'pacman --noconfirm -Suuy'
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          msys2 -c 'pacman --noconfirm -Suu'

      - name: Download msys2-runtime artifact
        uses: actions/download-artifact@v8
        with:
          name: install
          path: ${{ steps.msys2.outputs.msys2-location }}

      - name: uname -a
        shell: msys2 {0}
        run: uname -a

      - name: Run tests
        uses: msys2/msys2-tests@main
